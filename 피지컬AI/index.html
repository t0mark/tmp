<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피지컬AI 그림 모음</title>
<style>
  :root { --bg:#fafaf9; --panel:#fff; --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --panel:#262321; --ink:#f5f5f4; --muted:#a8a29e; --line:#3a3633; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Pretendard","Noto Sans KR",system-ui,sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:28px 16px 48px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  h1 { font-size:22px; margin:0; }
  .count { color:var(--muted); }
  input { margin-left:auto; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); font:inherit; min-width:200px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
  a.card { display:block; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; color:inherit; text-decoration:none; transition:border-color .15s; }
  a.card:hover { border-color:var(--accent); }
  .thumb { height:200px; overflow:hidden; position:relative; border-bottom:1px solid var(--line); background:var(--bg); }
  .thumb iframe { width:250%; height:250%; transform:scale(.4); transform-origin:0 0; border:0; pointer-events:none; }
  .meta { padding:10px 14px 12px; }
  .meta b { display:block; }
  .meta span { color:var(--muted); font-size:13px; }
  .home { display:inline-block; margin-bottom:10px; font-size:14px; color:var(--muted); text-decoration:none; }
  .home:hover { color:var(--accent); }
  .empty { color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<main>
  <a class="home" href="../">← 전체 작업</a>
  <header>
    <h1>피지컬AI 그림 모음</h1>
    <span class="count" id="count"></span>
    <input id="q" type="search" placeholder="검색">
  </header>
  <div class="grid" id="grid"></div>
</main>
<script src="figs/manifest.js"></script>
<script>
  const figs = window.FIGS || [];
  const grid = document.getElementById("grid");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function render(q = "") {
    const list = figs.filter(f => (f.title + " " + (f.desc||"")).toLowerCase().includes(q.toLowerCase()));
    document.getElementById("count").textContent = `${list.length}개`;
    grid.innerHTML = list.length ? list.map(f => `
      <a class="card" href="figs/${esc(f.file)}" target="_blank">
        <div class="thumb"><iframe src="figs/${esc(f.file)}" loading="lazy" tabindex="-1"></iframe></div>
        <div class="meta"><b>${esc(f.title)}</b><span>${esc(f.date)} · ${esc(f.desc)}</span></div>
      </a>`).join("") : `<p class="empty">아직 그림이 없어요. 채팅으로 설명해 주세요.</p>`;
  }
  document.getElementById("q").addEventListener("input", e => render(e.target.value));
  render();
</script>
</body>
</html>
